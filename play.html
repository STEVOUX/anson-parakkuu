<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Play Anson Parakkuu, a funny flappy bird style game where Anson tries to fly and crashes into gas cylinders. Tap to play this hilarious browser game online for free.">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta property="og:title" content="Anson Parakkuu Game">
    <meta property="og:description" content="Funny flying game">
    <meta property="og:image" content="Assets/anson%20hit.png">
    <meta property="og:type" content="website">
    <title>Anson Parakkuu – Funny Flappy Bird Style Game | Play Anson Fly Online</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-title" content="Anson Fly">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="Assets/anson%20smile.png">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Assets/anson%20smile.png">
</head>
<body    <!-- Outer wrapper for centering 9:16 on desktop -->
    <div id="game-wrapper">
        <div id="game-container">
            <!-- Floating Fullscreen Button -->
            <button id="btn-fullscreen-toggle" class="btn-fullscreen-floating" aria-label="Fullscreen" title="Press 'F' for Fullscreen">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
            <div class="fullscreen-hint">Press 'F' for Fullscreen</div>

            <!-- Game Canvas -->
            <canvas id="game-canvas"></canvas>

            <!-- Score Display (during gameplay) -->
            <div id="score-display">0</div>

            <!-- Flash Effect on Hit -->
            <div id="flash-overlay"></div>

            <!-- Get Ready Overlay -->
            <div id="get-ready-overlay">
                <div class="get-ready-text">Get Ready!</div>
                <div class="tap-hint">Tap or press Space to fly</div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="screen-overlay">
                <img src="Assets/anson-title.png" alt="funny flappy bird style game" class="title-image" id="title-img">
                <img src="Assets/anson smile.png" alt="Anson flying funny game character" class="start-character" id="start-char">
                <div class="subtitle">Tap to make Anson fly ✨</div>
                <button class="btn-play" id="btn-play" type="button">Play</button>
                <div class="high-score-display">Best: <span id="menu-highscore">0</span></div>
                <div class="creator-credits">game made by <a href="https://github.com/STEVOUX/STEVOUX" target="_blank" rel="noopener noreferrer">STEVOUX</a></div>
            </div>

            <!-- Game Over Screen -->
            <div id="gameover-screen" class="screen-overlay hidden">
                <div id="gameover-title" class="gameover-title">Anson Crashed! 💀</div>
                <div id="gameover-roast" class="gameover-roast"></div>
                
                <img src="Assets/anson hit.png" alt="Anson Parakkuu gameplay screenshot" class="gameover-character">
                
                <div class="score-container">
                    <div class="score-row">
                        <span class="score-label">SCORE</span>
                        <span class="score-value" id="final-score">0</span>
                    </div>
                    <div class="score-row">
                        <span class="score-label">BEST</span>
                        <span class="score-value best" id="final-highscore">0</span>
                    </div>
                </div>
                
                <button class="btn-retry" id="btn-retry" type="button">Retry</button>
                <button class="btn-home" id="btn-home" type="button">Home</button>
            </div>
        </div>
    </div>


    <!-- Audio Assets -->
    <audio id="sfx-jump" src="Assets/sfx/faah 1.mpeg" preload="auto"></audio>
    <audio id="sfx-score" src="Assets/sfx/faah 2.mpeg" preload="auto"></audio>
    <audio id="sfx-death" src="Assets/sfx/gwak anson.mpeg" preload="auto"></audio>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        const fullscreenBtn = document.getElementById('btn-fullscreen-toggle');
        const gameWrapper = document.getElementById('game-wrapper');

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (gameWrapper.requestFullscreen) {
                    gameWrapper.requestFullscreen();
                } else if (gameWrapper.webkitRequestFullscreen) {
                    gameWrapper.webkitRequestFullscreen();
                } else if (gameWrapper.msRequestFullscreen) {
                    gameWrapper.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);

        window.addEventListener('keydown', (e) => {
            // Toggle fullscreen when 'F' is pressed (ignore if typing in an input)
            if ((e.key === 'f' || e.key === 'F') && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                toggleFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenBtn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>`;
            } else {
                fullscreenBtn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>`;
            }
        });
    </script></script>
    <script src="game.js?v=3"></script>
</body>
</html>
